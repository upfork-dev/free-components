<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pulse Bento Feature Highlights: Interactive SaaS Feature Section with Live Demo Cards (Tailwind, Animated, Responsive)</title>
    <meta
      name="description"
      content="A premium SaaS feature highlights section with four live product-demo cards — real-time KPI sparklines, looping global client list, animated integration flows and a working team-workspace demo. Cursor spotlight borders, dark/light mode, full accessibility. Tailwind CSS + vanilla JS."
    />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2309090b'/%3E%3Crect x='6' y='6' width='12' height='9' rx='2.5' fill='%232dd4bf'/%3E%3Crect x='20' y='6' width='6' height='9' rx='2.5' fill='%23c084fc'/%3E%3Crect x='6' y='17' width='6' height='9' rx='2.5' fill='%234ade80'/%3E%3Crect x='14' y='17' width='12' height='9' rx='2.5' fill='%238b5cf6'/%3E%3C/svg%3E"
    />
    <script>
      // Before the first paint: let the script take over the reveal, and apply the demo's saved theme.
      document.documentElement.classList.add("pbf-js");
      // Fetch the font early so the headline never rewraps (not from file://, where the font is at hand anyway
      // and a preload's CORS request would fail).
      if (location.protocol !== "file:") {
        const font = Object.assign(document.createElement("link"), { rel: "preload", as: "font", type: "font/woff2", href: "fonts/geist-latin.woff2", crossOrigin: "" });
        document.head.append(font);
      }
      try {
        const theme = localStorage.getItem("pbf-demo-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <style>
      @font-face {
        font-family: "Geist";
        src: url("fonts/geist-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
    </style>
    <!-- Tailwind utilities for the section layout and the demo page (generated by npm run build). -->
    <style data-tailwind>
      {{TAILWIND}}
    </style>
    <!-- Pulse Bento Feature Highlights: the component's own styles. -->
    <style>
      {{COMPONENT_CSS}}
    </style>
  </head>
  <body class="bg-[#fafafa] font-sans text-zinc-900 antialiased dark:bg-[#09090b] dark:text-zinc-100">
    <!-- Demo only: light / system / dark. The component itself follows prefers-color-scheme or data-theme. -->
    <div
      class="fixed top-4 right-4 z-50 flex gap-1 rounded-full border border-zinc-900/10 bg-white/70 p-1 backdrop-blur-md dark:border-white/10 dark:bg-zinc-900/70"
      role="group"
      aria-label="Theme"
    >
      <button type="button" data-value="light" aria-label="Light theme" class="demo-theme-btn grid size-8 cursor-pointer place-items-center rounded-full text-zinc-500 transition-colors hover:text-zinc-900 aria-pressed:bg-zinc-900/5 aria-pressed:text-zinc-900 dark:text-zinc-400 dark:hover:text-white dark:aria-pressed:bg-white/10 dark:aria-pressed:text-white">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
      </button>
      <button type="button" data-value="system" aria-label="System theme" class="demo-theme-btn grid size-8 cursor-pointer place-items-center rounded-full text-zinc-500 transition-colors hover:text-zinc-900 aria-pressed:bg-zinc-900/5 aria-pressed:text-zinc-900 dark:text-zinc-400 dark:hover:text-white dark:aria-pressed:bg-white/10 dark:aria-pressed:text-white">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8M12 16v4" /></svg>
      </button>
      <button type="button" data-value="dark" aria-label="Dark theme" class="demo-theme-btn grid size-8 cursor-pointer place-items-center rounded-full text-zinc-500 transition-colors hover:text-zinc-900 aria-pressed:bg-zinc-900/5 aria-pressed:text-zinc-900 dark:text-zinc-400 dark:hover:text-white dark:aria-pressed:bg-white/10 dark:aria-pressed:text-white">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg>
      </button>
    </div>

{{SECTION:pbf-heading-1:}}

{{SECTION:pbf-heading-2:bento}}

    <footer class="px-6 py-10 text-center text-sm text-zinc-500 dark:text-zinc-400">
      Pulse Bento Feature Highlights · demo. The companies, people and figures shown are placeholders.
    </footer>

    <!-- Pulse Bento Feature Highlights: the component's script. -->
    <script>
{{COMPONENT_JS}}
    </script>

    <!-- Demo only: the theme switch. -->
    <script>
      (() => {
        const buttons = document.querySelectorAll(".demo-theme-btn");
        const current = () => document.documentElement.dataset.theme || "system";
        const render = () => buttons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.value === current())));
        buttons.forEach((button) =>
          button.addEventListener("click", () => {
            const value = button.dataset.value;
            if (value === "system") delete document.documentElement.dataset.theme;
            else document.documentElement.dataset.theme = value;
            try {
              value === "system" ? localStorage.removeItem("pbf-demo-theme") : localStorage.setItem("pbf-demo-theme", value);
            } catch {}
            render();
          }),
        );
        render();
      })();
    </script>
  </body>
</html>
